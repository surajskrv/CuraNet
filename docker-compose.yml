version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: curanet-backend
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: curanet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
